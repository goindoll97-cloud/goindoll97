name: Build Windows desktop application

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop_app.py"
      - "desktop_backend.py"
      - "desktop_report.py"
      - "desktop_report_test.py"
      - "desktop_results.py"
      - "desktop_results_test.py"
      - "desktop_smoke_test.py"
      - "desktop_ui_smoke_test.py"
      - "engine/result_store.py"
      - "engine/regulatory_api.py"
      - "engine/trust_gate.py"
      - "engine/plain_report.py"
      - "engine/broad_salt_identity.py"
      - "engine/no_cas_scope.py"
      - "engine/tests/test_company_engine.py"
      - "engine/tests/test_no_cas_scope.py"
      - "engine/company_engine.py"
      - "desktop_regression_test.py"
      - "desktop.spec"
      - "law_api.env.example"
      - "build_desktop.bat"
      - "requirements-desktop.txt"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Check Python syntax
        run: python -m py_compile desktop_app.py desktop_backend.py desktop_report.py desktop_report_test.py desktop_results.py desktop_results_test.py desktop_smoke_test.py desktop_ui_smoke_test.py desktop_regression_test.py engine/regulatory_api.py engine/trust_gate.py engine/plain_report.py

      - name: Qt ON/OFF switch widget smoke test
        run: python desktop_ui_smoke_test.py

      - name: Offline result-folder cleanup safety test
        run: python desktop_results_test.py

      - name: Offline rule screening smoke test (without Ollama)
        run: python desktop_smoke_test.py

      - name: "Desktop report - four decisions and exactly three worksheets"
        run: python desktop_report_test.py

      - name: Effective-date and approved-rule reporting regression test
        run: python desktop_regression_test.py

      - name: Verify recent CAS-date and scope-candidate fixes
        shell: pwsh
        env:
          PYTHONPATH: engine
        run: |
          python -m unittest engine.tests.test_company_engine.ExcelDateCasRepairTest
          python -m unittest engine.tests.test_no_cas_scope.NoCasScopeTest.test_explicit_exclusion_only_keeps_non_regulated_decision engine.tests.test_no_cas_scope.NoCasScopeTest.test_candidate_already_evaluated_by_verified_match_keeps_decision engine.tests.test_no_cas_scope.NoCasScopeTest.test_unverified_candidate_is_still_held

      - name: Build standalone Windows application
        run: python -m PyInstaller --noconfirm --clean desktop.spec


      - name: Verify empty API credential template beside EXE
        shell: pwsh
        run: |
          $exe = 'dist/ChemicalRegulatoryDesktop/ChemicalRegulatoryDesktop.exe'
          $envFile = 'dist/ChemicalRegulatoryDesktop/.env'
          if (!(Test-Path -LiteralPath $exe)) { throw 'EXE missing' }
          if (!(Test-Path -LiteralPath $envFile)) { throw '.env not packaged next to EXE' }
          $lines = @(Get-Content -LiteralPath $envFile -Encoding utf8)
          if ($lines.Count -lt 1 -or $lines[0] -ne 'LAW_OC=') { throw '.env template must start with an empty LAW_OC=' }
          Write-Host 'PASS: blank .env is present next to the executable'

      - name: Publish Windows application folder
        uses: actions/upload-artifact@v4
        with:
          name: ChemicalRegulatoryDesktop-Windows
          path: dist/ChemicalRegulatoryDesktop/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
